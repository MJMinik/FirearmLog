# FirearmLog — end-to-end (Playwright) tests.
# Runs on every push and pull request. Drives the real app in a headless
# browser to prove the UI is wired up, complementing the unit tests in deploy.yml.
#
# Sharded 4 ways (finding H-6): the full suite (506+ tests, both projects) on
# one runner had grown to/over the 25-minute ceiling. Each shard now runs a
# quarter of the suite (both desktop and mobile projects, since Playwright's
# --shard splits across ALL selected projects) with its own 15-minute budget.
# workers stays 1 in CI (unchanged in playwright.config.ts) so each shard's
# run is still deterministic — only the number of parallel runners changed.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e -- --shard=${{ matrix.shard }}/4

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
