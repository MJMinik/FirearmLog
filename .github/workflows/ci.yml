# FirearmLog — pull-request / branch gate.
# Runs the type-check, unit tests, and lint on every PR and on every push to a
# non-main branch, so nothing merges into main unverified. (main itself is
# covered by Build-and-Deploy, which also runs tsc + unit before publishing;
# E2E runs in e2e.yml.) This is the "harness" that keeps main green.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests + import check
        run: npm test

      - name: Type-check + build
        run: npm run build
